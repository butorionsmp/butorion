      cursor: pointer;

transition: all 0.2s;
}

border-color: var(--gold);

}
.copy-badge {
background: rgba(255, 255, 255, 0.08);

}
footer {

.toast {
position: fixed;
bottom: 28px;

@media (max-width: 600px) {

// ВСТАВЬ СВОИ 3 ССЫЛКИ В ЭТОТ БЛОК:

const CONFIG = {
serverIP: 'butorion.ru',
discordInvite: 'https://discord.gg/fqfgdKMhc',
launcherDownloadUrl: 'github.com',
modsDownloadUrl: 'github.com'
};
// Подстановка ссылок
document.querySelectorAll('.js-discord').forEach(el => el.href = CONFIG.discordInvite);
document.getElementById('dl-launcher').href = CONFIG.launcherDownloadUrl;
document.getElementById('dl-mods').href = CONFIG.modsDownloadUrl;
// Переключение между главной и страницей "Начать играть"
const pageHome = document.getElementById('page-home');
const pagePlay = document.getElementById('page-play');
function showPage(page) {
pageHome.classList.remove('active');
pagePlay.classList.remove('active');
page.classList.add('active');
window.scrollTo({ top: 0, behavior: 'smooth' });
}
document.getElementById('go-play').addEventListener('click', () => showPage(pagePlay));
document.getElementById('go-home').addEventListener('click', () => showPage(pageHome));
document.getElementById('logo-home').addEventListener('click', () => showPage(pageHome));
// Копирование IP
const copyBox = document.getElementById('copy-ip');
const toast = document.getElementById('toast');
const copyLabel = document.getElementById('copy-label');
copyBox.addEventListener('click', () => {
navigator.clipboard.writeText(CONFIG.serverIP);
copyLabel.textContent = 'Скопировано!';
toast.classList.add('show');
setTimeout(() => {
toast.classList.remove('show');
copyLabel.textContent = 'Скопировать IP';
}, 2200);
});
// Живой онлайн сервера
async function checkServerStatus() {
const dot = document.getElementById('status-dot');
const text = document.getElementById('status-text');
try {
const res = await fetch(https://mcsrvstat.us{CONFIG.serverIP});
const data = await res.json();
if (data.online) {
dot.classList.remove('offline');
text.textContent = Онлайн: ${data.players.online} / ${data.players.max};
} else {
dot.classList.add('offline');
text.textContent = 'Старт 25 ноября в 19:00';
}
} catch (e) {
text.textContent = 'IP: butorion.ru';
}
}
checkServerStatus();
